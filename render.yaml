databases:
  - name: sigcm-db
    databaseName: db_sigcm
    user: sigcm_admin
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: sigcm-web
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: SIGCM
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: prefer
      - key: DB_HOST
        fromDatabase:
          name: sigcm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sigcm-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sigcm-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sigcm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sigcm-db
          property: password
      - key: DB_ASISTENTE_USERNAME
        value: asistente_clinica_web
      - key: DB_ASISTENTE_PASSWORD
        value: ClinicaSecure2026!
